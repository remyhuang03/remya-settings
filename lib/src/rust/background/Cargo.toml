[package]
name = "remya_settings_background"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
material-colors = { version = "0.5.0", features = ["quantize"] }
remya_settings_display = { path = "../display" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3.23"
