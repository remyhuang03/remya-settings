[package]
name = "remya_settings_camera"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["preview"]
preview = ["dep:flutter_rust_bridge", "dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[dependencies]
pipewire = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
remya_settings_display = { path = "../display" }
flutter_rust_bridge = { version = "=2.13.0", optional = true }
gstreamer = { version = "0.25", features = ["v1_28"], optional = true }
gstreamer-app = { version = "0.25", features = ["v1_28"], optional = true }
gstreamer-video = { version = "0.25", features = ["v1_28"], optional = true }

[dev-dependencies]
tempfile = "3.23"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[[example]]
name = "preview"
required-features = ["preview"]
