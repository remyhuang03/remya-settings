[package]
name = "remya_settings_service"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "remya-settings-service"
path = "src/main.rs"

[dependencies]
gio = { version = "0.21.5", features = ["v2_84"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
xdg = "3"
tempfile = "3.23"
remya_settings_appearance = { path = "../appearance", default-features = false }
remya_settings_date_time = { path = "../date_time", default-features = false }
remya_settings_display = { path = "../display" }
remya_settings_system_information = { path = "../system_information" }
remya_settings_background = { path = "../background" }
remya_settings_fonts = { path = "../fonts" }
remya_settings_default_apps = { path = "../default_apps" }
remya_settings_applications = { path = "../applications" }
remya_settings_network = { path = "../network" }
