[package]
name = "remya_settings_appearance"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["bridge"]
bridge = []

[dependencies]
serde = { version = "1", features = ["derive"] }
flutter_rust_bridge = "=2.13.0"
gio = { version = "0.21.5", features = ["v2_84"] }
tempfile = "3.23"
base64 = "0.23"
png = "0.18"
serde_json = "1"
toml = "0.9"
xcursor = "0.3"
remya_settings_display = { path = "../display" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
