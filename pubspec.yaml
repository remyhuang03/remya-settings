name: remya_settings
description: "A Material Design 3 Expressive system settings application for Hyprland."
publish_to: 'none'
version: 0.1.0+2026-10-26

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.5.0
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/settings/catalog.json
    - assets/icons/settings.svg
    - assets/icons/settings.png
    - LICENSE
