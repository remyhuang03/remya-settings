name: remya_settings
description: "A Material Design 3 Expressive system settings application for Hyprland."
publish_to: 'none'
version: 0.1.0+2026-10-26

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  dbus: ^0.8.0
  flutter_rust_bridge: 2.13.0
  material_ui: ^1.5.0
  toml: ^0.18.0
  remya_settings_client:
    path: packages/remya_settings_client
  window_manager: ^0.5.2
  file_selector: ^1.1.0
  flex_color_picker: ^4.0.0
  croppy: ^1.5.3
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/settings/catalog.json
    - assets/icons/settings.svg
    - assets/icons/settings.png
    - LICENSE
    - assets/licenses/rust-dependencies.txt
    - assets/licenses/croppy-kiwi.txt
