name: Bug report
description: Report a problem with Remy'a Settings.
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/remyhuang03/remya-settings/issues?q=is%3Aissue) before filing.
        This report is public. Remove private information from logs and attachments.
        Report suspected vulnerabilities [privately](https://github.com/remyhuang03/remya-settings/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Navigation or search
        - System setting
        - Shared Remya setting
        - Camera preview
        - Installation or startup
        - Other or unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and installation method
      placeholder: "Example: an installed release, package version, or source commit"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Linux distribution and Hyprland version
      description: Include the relevant version from `hyprctl version` if available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the relevant command, action, or shortcut.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant setup and logs
      description: >-
        Include the page and control, the Remya Core version, and the relevant system service or hardware. Share only sanitized logs.
